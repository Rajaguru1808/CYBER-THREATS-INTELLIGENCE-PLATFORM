{% extends 'base.html' %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">500</h1>
    <p class="lead">Something went wrong on our end. The error has been logged.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="text-center py-5">
    <h1 class="display-1 text-danger">500</h1>
    <p class="lead">Something went wrong on our end.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Go to Login</a>
</div>
{% endblock %}
