{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-brand">
            <i class="bi bi-shield-lock-fill"></i>
            <h3>CTI Platform</h3>
            <p class="text-muted">Cyber Threat Intelligence Platform using Indicators of Compromise</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" name="username" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" name="password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <div class="auth-demo-hint mt-4">
            <strong>Demo credentials</strong>
            <div class="d-flex justify-content-between mt-1">
                <span>Admin</span><code>admin / Admin@123</code>
            </div>
            <div class="d-flex justify-content-between">
                <span>Analyst</span><code>analyst / Analyst@123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
